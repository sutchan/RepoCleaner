# Repo Manager 运行配置示例（docs/config.example.ini）
#
# 真实的 config.ini 由程序在可执行文件同目录自动生成（含开发者本机路径），
# 自 v2.2.0 起不再纳入版本控制（见 .gitignore）。
# 复制本文件为 config.ini 即可获得与下述一致的默认行为；键缺失时程序按内部默认值处理。
#
# REPO_ROOT：仓库根目录，包含多个前端项目的父目录（默认 Windows: E:\Github，macOS/Linux: ~/Github）
REPO_ROOT=E:\Github
# LANG：界面与日志语言，可选 zh（中文，默认）/ en（English）
LANG=zh
# RECURSIVE：递归扫描 monorepo 深层项目（v2.3.0 起支持，深度 3 层，默认 false）
RECURSIVE=false
# EXTRA_CLEAN_DIRS：自定义清理目录名，逗号分隔（v2.3.0 起支持），
# 并入功能 6 / 7 清理白名单，仅限项目目录内部匹配；留空表示无自定义项
EXTRA_CLEAN_DIRS=
