; RepoCleaner Language Configuration
; LANG=en (English) | zh (Chinese)
; Version: 1.0.1

LANG=zh

[en]
; Main Menu
MENU_TITLE=RepoCleaner - Github Project Cleaner
MENU_TARGET=Target:
MENU_OPTION1=Enable Global node_modules     - No local node_modules
MENU_OPTION2=Reset Node Config             - Restore default settings
MENU_OPTION3=Clean .next Cache             - Disable NextJS cache
MENU_OPTION4=Restore NextJS Cache          - Enable normal compilation
MENU_OPTION5=Install Global Dependencies   - React/Vue/Next/axios/tools
MENU_OPTION6=Clean All Project Cache       - Remove node_modules/.next/dist
MENU_EXIT=Exit
MENU_CHOOSE=Enter choice [0-6]:

; Language Selection
LANG_TITLE=Select Language / 选择语言
LANG_1=English
LANG_2=中文
LANG_PROMPT=Enter choice [1-2]:

; Path Selection
PATH_TITLE=Select Repository Root Directory
PATH_1=Use Current Directory:
PATH_2=Use Parent Directory:
PATH_3=Manual Input Path
PATH_4=Use Default:
PATH_PROMPT=Enter choice [1-4]:
PATH_ERROR=ERROR: Path does not exist! Please try again...
PATH_SAVE=Save as default? [Y/N]:
PATH_SAVED=Config saved to config.ini

; Function 1: Global Node
F1_TITLE=Enable Global node_modules
F1_STEP1=[1/4] Getting global node_modules path...
F1_STEP2=[2/4] Setting NODE_PATH environment variable...
F1_STEP3=[3/4] Disabling local node_modules for all projects...
F1_SUCCESS=Global node_modules Enabled!
F1_INFO=Run [5] to install dependencies first time

; Function 2: Reset Node
F2_TITLE=Reset Node Config
F2_STEP1=Removing NODE_PATH environment variable...
F2_STEP2=Cleaning project .npmrc configs...
F2_SUCCESS=Node Config Reset!

; Function 3: Clean .next
F3_TITLE=Clean .next Cache
F3_STEP1=Scanning and cleaning NextJS cache...
F3_SUCCESS=.next Cache Cleaned and Disabled!

; Function 4: Restore .next
F4_TITLE=Restore NextJS Cache
F4_STEP1=Restoring NextJS cache functionality...
F4_SUCCESS=NextJS Cache Restored!

; Function 5: Install Dependencies
F5_TITLE=Installing Common Global Dependencies
F5_LIST=Install List: React, Vue, Next, Axios, Express, pnpm, yarn, rimraf, etc.
F5_WAIT=Please wait...
F5_STEP1=[1/5] Installing React ecosystem...
F5_STEP2=[2/5] Installing Vue ecosystem...
F5_STEP3=[3/5] Installing HTTP libraries...
F5_STEP4=[4/5] Installing package managers...
F5_STEP5=[5/5] Installing dev tools...
F5_SUCCESS=All Dependencies Installed!
F5_INFO=Projects can use them directly without local install

; Function 6: Clean All Cache
F6_TITLE=Cleaning All Project Cache
F6_WARNING=WARNING: This will permanently delete all cache files!
F6_SUCCESS=All Cache Cleaned!

; Common
OK=[OK]
ERROR=[ERROR]
PAUSE=Press any key to continue...

