# 功能建议模板 v2.2.0
name: 功能建议
description: 提出新功能或对现有行为的改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议。提交前请先查看[扩展计划](https://github.com/sutchan/RepoCleaner/blob/main/docs/OPENSPEC.md)（§10）与[变更历史](https://github.com/sutchan/RepoCleaner/blob/main/CHANGELOG.MD)，避免与既有计划重复。

        使用疑问请走[支持指南](https://github.com/sutchan/RepoCleaner/blob/main/.github/SUPPORT.md)；安全漏洞请勿公开提交。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述实际场景与痛点，而非直接给出实现方式
      placeholder: 管理 monorepo 时，深层项目不会被扫描，需要手动逐个指定目录……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 说明期望的行为；若涉及删除操作，请说明如何保证安全边界与二次确认
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的其它做法，以及为何不选
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 批处理脚本（RepoCleaner.bat）
        - 参考界面应用（根 src/）
        - 文档 / 规范
        - 工程配置 / 门禁
        - 多项或尚不确定
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性影响
      description: 是否改变现有命令、配置格式或删除行为？是否属于破坏性变更？
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      options:
        - label: 我已查看 OPENSPEC.md §10 扩展计划，确认不是重复建议
          required: true
        - label: 我理解本工具的删除操作不可逆，新功能不应绕过二次确认与安全边界
          required: true
        - label: 我愿意参与实现或提交 PR（可选）
          required: false
