# .github/workflows/release.yml v2.3.3
# 发布工作流（行为契约见 docs/CONTRIBUTING.md §8.4）：
# tag push 或手动触发 → version 读取唯一权威源 → build 多平台矩阵
# → package 统一打包为 <产品名>-v<版本>-<os>-<arch>.<扩展名> 并保留 artifact
# → 仅 tag push 时 release 校验同 SHA 其它工作流全绿、版本一致后创建 Release。
#
# 门禁不在本工作流重复：ci.yml 在同 SHA 运行全部门禁，release job 会等待并校验其结论。
# 手动触发只产出 release-archives 压缩包，不创建 Release。
# linux/arm64 因托管 runner 缺 arm64 架构 GUI 开发库暂不产出；
# windows/arm64 因无 aarch64-w64-mingw32-gcc 暂不产出（本地 scripts/build.ps1 可补齐）。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version (authoritative source)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read version from internal/buildinfo/version.go
        run: |
          V=$(grep -oP 'const Version = "\K[^"]+' internal/buildinfo/version.go)
          test -n "$V" || { echo "版本权威源读取失败"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }

    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Linux 默认标签需 X11 + Wayland 开发库；交叉目标缺 arm64 架构库，故暂不构建 linux/arm64
      - name: Install Linux GUI dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev

      - name: Build
        shell: bash
        run: |
          BUILD_ID=$(date -u +%y%m%d%H%M)
          export GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=1
          NAME="repo-manager-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then NAME="$NAME.exe"; fi
          echo "build $NAME (build $BUILD_ID)"
          go build -trimpath -ldflags "-s -w -X repo-manager/internal/buildinfo.BuildID=$BUILD_ID" -o "dist/$NAME" ./cmd/repo-manager

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # 打包独立成 job：手动触发也能直接下载压缩包，无需发布 Release
  package:
    needs: [version, build]
    name: package (archives)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Package release archives
        run: bash scripts/package-release.sh "${{ needs.version.outputs.version }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [version, build, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: release (verify + publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist

      # 同 SHA 的其它工作流（含 ci 与今后新增的工作流）必须全部为绿，否则阻断发布
      - name: Verify all other workflows are green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          for i in $(seq 1 30); do
            STATE=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | select(.name != "release") | "\(.status)|\(.conclusion)"')
            if [ -z "$STATE" ]; then
              echo "未找到该提交上的其它工作流运行，阻断发布"; exit 1
            fi
            if echo "$STATE" | grep -q -v '^completed|success$'; then
              if echo "$STATE" | grep -q '^completed|'; then
                echo "存在失败的工作流，阻断发布："; echo "$STATE"; exit 1
              fi
              echo "工作流仍在运行，等待 20s ($i/30)"; sleep 20; continue
            fi
            echo "该提交的其它工作流均为绿：$SHA"; exit 0
          done
          echo "其它工作流未在 10 分钟内结束，阻断发布"; exit 1

      - name: Verify version consistency (tag == buildinfo == package.json)
        run: |
          TAG="${GITHUB_REF_NAME}"
          V="${{ needs.version.outputs.version }}"
          PJSON=$(node -p "require('./package.json').version")
          echo "tag=$TAG version.go=$V package.json=$PJSON"
          [ "v$V" = "$TAG" ] || { echo "tag 与 internal/buildinfo/version.go 不一致，终止发布"; exit 1; }
          [ "$PJSON" = "$V" ] || { echo "package.json 与版本权威源不一致，终止发布"; exit 1; }

      - name: Release notes
        run: |
          V="${{ needs.version.outputs.version }}"
          awk -v pat="^## \\[$V\\]" 'f && /^## /{exit} $0 ~ pat {f=1} f' CHANGELOG.MD > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.MD 中未找到 [$V] 小节"; exit 1; }
          head -3 release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tar.gz)
          ((${#assets[@]} > 0)) || { echo "没有可上传的归档资产"; exit 1; }
          # 预发布版本用 Release 的 prerelease 标记区分，不在归档文件名加后缀
          V="${{ needs.version.outputs.version }}"
          PRERELEASE=""
          case "$V" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" dist/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag $PRERELEASE
