# .github/workflows/ci.yml v2.3.3
# 仓库级门禁（行为契约见 docs/CONTRIBUTING.md §8.4 / §9.1）：
# check 跑全套静态 / 测试门禁；windows-smoke 在 Windows runner 验证平台层代码；
# gui-build 在 Linux 验证默认标签的完整 Fyne GUI 编译。
# -tags ci 使用 Fyne software driver，无需 C 工具链即可验证 internal/ui 代码可编译。
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: gate (nogui + ci + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: check:root-clean
        run: npm run check:root-clean

      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: go vet (nogui)
        run: go vet -tags nogui ./...

      - name: go test (nogui)
        run: go test -tags nogui -count=1 ./...

      - name: go build (nogui)
        run: go build -tags nogui ./...

      - name: go build (ci tags, GUI code)
        run: go build -tags ci ./...

      - name: npm ci
        run: npm ci

      - name: check:docs
        run: npm run check:docs

  # Windows 平台层此前只在发版时首次编译，PR 阶段无法发现问题
  windows-smoke:
    name: windows smoke (nogui + ci)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go test (nogui)
        run: go test -tags nogui -count=1 ./...

      - name: go build (ci tags, GUI code)
        run: go build -tags ci ./...

  gui-build:
    name: gui build (linux, default tags)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install OpenGL / X11 / Wayland dev libraries
        run: |
          sudo apt-get update
          # go-gl/glfw v3.4 在 Linux 默认标签同时编译 X11 与 Wayland 后端，
          # 缺 libwayland-dev / libxkbcommon-dev 会在 wl_platform.h 处直接编译失败。
          sudo apt-get install -y \
            libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev

      - name: go build (default tags, Fyne GUI)
        run: mkdir -p .tmp && go build -trimpath -o .tmp/repo-manager ./cmd/repo-manager
