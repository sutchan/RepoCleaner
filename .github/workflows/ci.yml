# .github/workflows/ci.yml v2.3.2
# 仓库级自动门禁（行为契约见 docs/CONTRIBUTING.md §8.4 / §9.1）：
# check:root-clean + gofmt + go vet + go test + go build（nogui / ci）+ npm run check:docs，
# 另含 Fyne GUI（默认构建标签，需 OpenGL / C 工具链）编译验证。
# -tags ci 使用 Fyne software driver，无需 C 工具链即可验证 internal/ui 代码可编译。
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: gate (nogui + ci + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: check:root-clean
        run: npm run check:root-clean

      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: go vet (nogui)
        run: go vet -tags nogui ./...

      - name: go test (nogui)
        run: go test -tags nogui -count=1 ./...

      - name: go build (nogui)
        run: go build -tags nogui ./...

      - name: go build (ci tags, GUI code)
        run: go build -tags ci ./...

      - name: npm ci
        run: npm ci

      - name: check:docs
        run: npm run check:docs

  gui-build:
    name: gui build (linux, default tags)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install OpenGL / X11 / Wayland dev libraries
        run: |
          sudo apt-get update
          # go-gl/glfw v3.4 在 Linux 默认标签同时编译 X11 与 Wayland 后端，
          # 缺 libwayland-dev / libxkbcommon-dev 会在 wl_platform.h 处直接编译失败。
          sudo apt-get install -y \
            libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev

      - name: go build (default tags, Fyne GUI)
        run: mkdir -p .tmp && go build -trimpath -o .tmp/repo-manager ./cmd/repo-manager
